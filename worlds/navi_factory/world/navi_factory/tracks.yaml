# worlds/navi_factory/world/navi_factory/tracks.yaml  (좌표는 월드 프레임 x, y — 단위 m)
#
# 이 파일이 navi_factory.sdf 옆에 있는 이유: 아래 좌표는 그 SDF 의 track_* 타일
# pose 를 실측한 값이고, tools/tracks_to_{markers,actors}.py 는 여기서 다시 그
# SDF 로 마커·actor 를 생성해 넣는다. 월드에 종속된 배치 기술서지 특정 ROS
# 패키지의 파라미터가 아니다 — 월드를 바꾸면 이 파일도 같이 바뀐다.
#
# navi_factory.sdf 의 track_* 타일 pose 를 실측해서 만든 파견(dispatch) 경로 정의.
# 월드가 dev/navi_world_set 병합으로 재구성되면서 트랙 레이아웃이 바뀌었다:
#   - 수신호석(0,36.05)에서 V자 두 가지(track_signal_v_l/r)가 상단 트랙(y=40)으로 갈라짐
#   - 상단 트랙은 좌우 코너(corner_tl/tr)를 거쳐 x=-18 / x=13 기둥으로 내려감
#   - 기둥 중간(y=13)에 목적지 원판(zone_nw/ne_disc_orange)이 있음
#   - 동쪽은 원판에서 y=13 통로(track_return_ne)로 척추(x=0, track_spine)에 합류
#   - 서쪽은 원판을 지나 계속 남진, 좌하단 코너 → 하단(y=-18) 동진 → 척추 남단 합류
#   - 척추(x=0)를 북진하면 수신호석으로 복귀 — 두 경로가 공유하는 "한길"이다
# 예전 레이아웃(signal_u 반원 회차루프, ne_entry 간선)의 트랙 정의는 월드에 더 이상
# 존재하지 않는 타일을 가리키므로 제거했다(git 이력에 있음).
#
# 소비자:
#   - mission_follower(auto_drive): routes 를 읽어 수신호 파견 주행을 한다.
#   - camera_node 의 수신호 존 게이트: signal_point / hand_signal_spot 을 읽는다.
#   - waypoint_follower(구 왕복 순찰): signal_point / stations 만 거리 대조에 쓴다 —
#     WAYPOINTS 가 옛 레이아웃 하드코딩이라 이 월드에서는 mission_follower 를 쓸 것.
#   - tools/tracks_to_markers.py: signal_point(빨강)/stations(초록) 원판 시각화.

signal_point: [0.0, 36.05]   # 수신호석 — V자 꼭짓점(track_signal_v 수렴점)
# 신호수가 서는 스팟(월드의 hand_signal_spot 모델 중심). camera_node의 수신호
# 게이트가 "로봇이 이쪽을 보고 있는가" 판정에 쓴다. 월드 SDF의 <pose>와 이중
# 기입이다 — 월드에서 스팟을 옮기면 이 값도 같이 고칠 것.
hand_signal_spot: [0.0, 40.0]

stations:
  # 수신호 파견 목적지 존 — 월드의 주황 원판(zone_*_disc_orange) 중심. 월드 SDF의
  # <pose>와 이중 기입이라, 월드에서 원판을 옮기면 이 값도 같이 고칠 것.
  # LEFT/RIGHT 라벨과 존의 짝은 신호수를 마주 본 로봇 자신의 좌/우 기준으로
  # signal_vision 의 labels.py(LABEL_DISPATCH)가 정한다 — 뒤집으려면 그쪽을 고칠 것.
  zone_nw: [-18.0, 13.0]     # 서쪽 존 — zone_nw_disc_orange
  zone_ne: [13.0, 13.0]      # 동쪽 존 — zone_ne_disc_orange

# 파견 경로. 키는 stations 의 존 이름과 같아야 한다 — camera_node 가
# signal_dispatch(std_msgs/String)로 이 키를 그대로 보내고, mission_follower 가
# 키로 경로를 찾는다. 모든 경로는 signal_point 에서 시작해 signal_point 로 끝난다
# (파견 → 원판 정차 → 복귀가 한 경로에 다 들어 있다).
# 좌표는 위 레이아웃 주석의 타일 실측값이고, 코너는 corner 타일 호를 3점으로 근사했다.
routes:
  zone_ne:
    waypoints:
      - [0.0, 36.05]     # 수신호석 출발
      - [3.0, 40.0]      # V 오른가지 꼭대기 → 상단 트랙 합류
      - [9.6, 40.0]      # 상단 직선 동쪽 끝(track_loop_top_r_4)
      - [11.5, 39.8]     # 우상단 코너 호(corner_tr)
      - [12.5, 39.0]
      - [13.0, 37.8]
      - [13.0, 14.9]     # 동쪽 기둥 남단(track_loop_right_12)
      - [13.0, 13.0]     # zone_ne 원판 — station 정차
      - [11.3, 13.0]     # 복귀 통로(track_return_ne) 진입, 서진
      - [0.5, 13.0]      # 척추 합류 직전
      - [0.0, 14.3]      # 척추(x=0) 북진 시작
      - [0.0, 33.9]      # 척추 북단(track_spine_1)
      - [0.0, 36.05]     # 수신호석 복귀
  zone_nw:
    waypoints:
      - [0.0, 36.05]     # 수신호석 출발
      - [-3.0, 40.0]     # V 왼가지 꼭대기 → 상단 트랙 합류
      - [-14.5, 40.0]    # 상단 직선 서쪽 끝(track_loop_top_l_1)
      - [-16.5, 39.8]    # 좌상단 코너 호(corner_tl)
      - [-17.5, 39.0]
      - [-18.0, 37.8]
      - [-18.0, 14.9]    # 서쪽 기둥, 원판 직전(track_nw_bridge_n)
      - [-18.0, 13.0]    # zone_nw 원판 — station 정차
      - [-18.0, -14.7]   # 서쪽 기둥 남단(track_loop_left_ext)
      - [-17.8, -16.5]   # 좌하단 코너 호(corner_bl)
      - [-17.0, -17.5]
      - [-15.8, -18.0]
      - [-1.0, -18.0]    # 하단 동쪽 끝(track_loop_bottom_l_1)
      - [0.0, -16.0]     # 척추 남단 진입(track_spine_ext2)
      - [0.0, 33.9]      # 척추 북진 → 북단(track_spine_1)
      - [0.0, 36.05]     # 수신호석 복귀
