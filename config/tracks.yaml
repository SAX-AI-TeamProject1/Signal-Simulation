# config/tracks.yaml  (poses are x, y, yaw in world frame)
#
# navi_factory.sdf의 track_* 타일 pose를 실측해서 만든 왕복 트랙. 이 창고엔 실제로
# 3개의 평행한 남북 간선(x=-2 nw_trunk / x=0 ne_entry / x=2 se_trunk)이 북쪽
# 공용 허브(신호지점 근처, y≈35~42)에서 갈라지고, 허브 맨 위에는 반원 회차루프
# (track_signal_u, 중심 (0,40) 반지름 3m, (3,40)→(0,43)→(-3,40))가 있다 —
# nw_hub_merge(-2.5,38.6)/se_hub_merge(2.5,38.6)를 통해 각각 nw_trunk/se_trunk와
# 이어진다. 이 지점들도 실측 스크립트로 좌표를 뽑은 것이다(눈대중 좌표 아님).
#
# 지금은 "1차선"(x=0, ne_entry 간선)만 왕복시킨다: 출발 → 살짝 옆(x=2)으로 붙어
# 회차루프를 한 바퀴 돈 뒤 → 다시 x=0으로 복귀해 1차선을 타고 남쪽 끝까지 → 왕복.
# x=2/x=-2 쪽으로 잠깐 붙는 구간(허브 안쪽)은 타일이 없는 빈 바닥이라 정확한
# 좌표가 없다 — 인접한 실타일 중심으로 근사했다.
#
# signal_point / stations: waypoint_follower.py(auto_drive)가 실제 주행 경로
# (src/auto_drive/auto_drive/patrol/waypoint_follower.py의 WAYPOINTS)의 각 지점이
# 목적지(station)인지 수신호를 받는 출발지점(signal_point)인지를 여기 좌표와 거리
# 대조해서 판정한다. tracks_to_markers.py는 같은 필드를 바닥 마커 색으로도
# 시각화한다(신호지점=빨강, 목적지=초록).
signal_point: [0.0, 36.05]   # 출발 — track_signal_entry_2 타일 중심
stations:
  south_end: [0.0, -12.1]    # 도착점 — track_ne_entry_south_11 타일 중심(1차선 남쪽 끝)
tracks:
  ne_entry_patrol:
    loop: true
    waypoints:
      - [0.0, 36.05, 0.5404]        # 출발(신호지점)
      - [2.0, 37.25, 1.222]         # 허브 안, x=2(se_trunk) 쪽으로 붙음
      - [2.5, 38.625, 1.222]        # se_hub_merge
      - [3.0, 40.0, 1.8849]         # 회차루프 진입(signal_u_1, 동쪽 끝)
      - [2.42705, 41.7634, 2.5133]  # 회차루프(signal_u_2)
      - [0.927051, 42.8532, 3.1416] # 회차루프(signal_u_3)
      - [-0.927051, 42.8532, -2.5133]  # 회차루프(signal_u_4)
      - [-2.42705, 41.7634, -1.8849]   # 회차루프(signal_u_5)
      - [-3.0, 40.0, -1.222]        # 회차루프 진출(signal_u_6, 서쪽 끝)
      - [-2.5, 38.625, -1.222]      # nw_hub_merge
      - [-2.0, 37.25, 0.0]          # 허브 안, x=0(1차선)으로 복귀
      - [0.0, 37.25, -1.5708]       # 1차선(ne_entry) 진입
      - [0.0, -12.1, -1.5708]       # 도착점(1차선 남쪽 끝)
