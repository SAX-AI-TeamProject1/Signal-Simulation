# ros_gz_bridge 설정 (ROS 2 ↔ Gazebo 토픽 변환 목록)
# launch 의 bridge 노드가 이 파일을 config_file 로 읽는다.
# direction: GZ_TO_ROS(gz→ros) / ROS_TO_GZ(ros→gz) / BIDIRECTIONAL(양방향)
# 토픽 추가/로봇 여러 대로 늘릴 때 여기 항목만 추가하면 됨(브릿지 노드는 하나로 충분). => 네임 스페이스 추가하여 구분

# clock 은 로봇별이 아니라 월드 전역 → 네임스페이스 붙이면 안 됨(/clock 유지).
- ros_topic_name: "/clock"                  # 시뮬 시계 (월드 전역)
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# --- robot1 (knavi_robot, 센서 없는 검증용 차체) 전체 주석 처리 ---
# 이 로봇은 bringup.launch.py 의 robot_info 에서 빠졌다(물리 검증이 끝났고, 무거운
# 월드에서 물리 로봇 2대는 부담). 스폰되지 않으므로 아래 항목들은 아무도 발행하지
# 않는 죽은 브리지였다. "로봇은 한 대인데 왜 2번이냐"는 혼란의 원인이라 주석으로
# 내린다 — 되살릴 때는 robot_info 에 항목을 추가하고 여기 주석만 풀면 된다.
#
# - ros_topic_name: "/robot1/cmd_vel"        # 속도 명령 (ROS → gz)
#   gz_topic_name: "/robot1/cmd_vel"
#   ros_type_name: "geometry_msgs/msg/Twist"
#   gz_type_name: "gz.msgs.Twist"
#   direction: ROS_TO_GZ
#
# - ros_topic_name: "/robot1/odom"           # 주행거리 (gz → ROS)
#   gz_topic_name: "/robot1/odom"
#   ros_type_name: "nav_msgs/msg/Odometry"
#   gz_type_name: "gz.msgs.Odometry"
#   direction: GZ_TO_ROS
#
# - ros_topic_name: "/robot1/joint_states"   # 바퀴 관절 상태 (gz → ROS)
#   gz_topic_name: "/robot1/joint_states"
#   ros_type_name: "sensor_msgs/msg/JointState"
#   gz_type_name: "gz.msgs.Model"
#   direction: GZ_TO_ROS
#
# - ros_topic_name: "/robot1/scan"           # 2D LiDAR (gz → ROS)
#   gz_topic_name: "/robot1/scan"
#   ros_type_name: "sensor_msgs/msg/LaserScan"
#   gz_type_name: "gz.msgs.LaserScan"
#   direction: GZ_TO_ROS
#
# - ros_topic_name: "/robot1/tf"             # odom→base tf (gz → ROS)
#   gz_topic_name: "/robot1/tf"
#   ros_type_name: "tf2_msgs/msg/TFMessage"
#   gz_type_name: "gz.msgs.Pose_V"
#   direction: GZ_TO_ROS

- ros_topic_name: "/robot2/cmd_vel"        # mecanum_lift_robot (Method B, 라이다+카메라)
  gz_topic_name: "/robot2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/robot2/odom"
  gz_topic_name: "/robot2/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/joint_states"
  gz_topic_name: "/robot2/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ROS 쪽 이름만 "/tf" 다 — 여기만 네임스페이스를 안 붙이는 이유:
# tf2_ros 는 토픽 이름을 앞에 슬래시 붙은 절대 경로로 박아 놓았다
# (transform_listener.hpp / transform_broadcaster.hpp 의 "/tf", "/tf_static").
# 그래서 노드에 네임스페이스를 줘도 tf 는 언제나 전역 /tf 로 오간다. 실제로
# robot_state_publisher 도 ns 가 robot2 인데 링크 tf 를 /tf 로 내보내고 있다.
# 여기만 /robot2/tf 로 두면 gz 가 주는 odom→base_link 를 구독하는 쪽이 아무도
# 없어서(RViz, tf2 버퍼, 나중의 Nav2 전부 /tf 만 본다) tf 트리가 odom 에서 끊긴다.
# 로봇을 여러 대로 늘릴 때는 이 토픽을 다시 가르는 게 아니라 robot_state_publisher
# 의 frame_prefix 로 프레임 "이름"을 갈라야 한다 — 토픽으로는 못 가른다.
- ros_topic_name: "/tf"
  gz_topic_name: "/robot2/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/scan"           # 라이다 (gz → ROS)
  gz_topic_name: "/robot2/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/pose_gt"        # 진짜(ground-truth) 월드 좌표 — odom
  gz_topic_name: "/model/mecanum_lift_robot/pose"  # 슬립으로 어긋나는 문제 회피용.
  ros_type_name: "geometry_msgs/msg/Pose"          # gz 토픽명은 모델 이름 기준이라
  gz_type_name: "gz.msgs.Pose"                     # ns가 아니라 model name을 씀.
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/camera/image"   # 트랙 마커(YOLO) 인식용 시뮬 카메라 (gz → ROS)
  gz_topic_name: "/robot2/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
