# ROS 2 <-> Gazebo topic bridge.
#
# The two middlewares do not speak to each other: ROS 2 topics are DDS, Gazebo
# topics are gz-transport carrying protobuf. Every topic that has to cross that
# line needs an entry here, naming both sides and which way it flows.
#
# Keep the gz_topic_name values in sync with the DiffDrive plugin in
# models/signal_robot/model.sdf — a typo here fails silently as "the robot just
# does not move".

# Velocity command: our controller publishes on the ROS side, the robot's
# DiffDrive plugin consumes it on the Gazebo side.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/signal_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Odometry back out of the simulation. Nothing consumes it yet; it is here
# because phase 2 (autonomous navigation) will need it, and because it is the
# quickest way to confirm from a terminal that the robot really moved.
- ros_topic_name: "/odom"
  gz_topic_name: "/model/signal_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Simulation time. Without this, ROS nodes run on wall-clock while Gazebo runs
# on its own clock, and the two drift apart whenever the sim is paused or runs
# slower than real time.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
