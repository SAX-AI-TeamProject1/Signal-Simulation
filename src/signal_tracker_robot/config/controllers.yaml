controller_manager:
  ros__parameters:
    update_rate: 100  # Hz — gz_ros2_control이 물리 스텝마다 컨트롤러를 도는 주기

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_position_controller:
      type: position_controllers/JointGroupPositionController

# arm_position_controller가 받는 Float64MultiArray의 값 순서 = 이 joints 목록 순서.
# motion_retarget_node.py가 정확히 이 순서로 18개 값을 채워 /arm_position_controller/commands에
# 발행해야 한다 (순서가 어긋나면 엉뚱한 관절이 움직인다).
arm_position_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_elbow
      - left_wrist
      - left_thumb_joint
      - left_index_joint
      - left_middle_joint
      - left_ring_joint
      - left_pinky_joint
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_elbow
      - right_wrist
      - right_thumb_joint
      - right_index_joint
      - right_middle_joint
      - right_ring_joint
      - right_pinky_joint
